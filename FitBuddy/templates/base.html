<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='styles.css') }}"
    >

</head>

<body>

<header class="site-header">

    <a
        class="brand"
        href="/"
    >
        FitBuddy
    </a>

    <nav>

        <a href="/">
            Generator
        </a>

        <a href="/docs">
            API Docs
        </a>

        <a href="/admin/login">
            Admin
        </a>

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer class="site-footer">

    FitBuddy provides general wellness information,
    not medical advice.

</footer>


<script src="{{ url_for('static', path='app.js') }}"></script>

</body>

</html>
