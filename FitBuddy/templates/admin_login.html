{% extends "base.html" %}


{% block title %}
FitBuddy – Admin Login
{% endblock %}


{% block content %}

<section class="card narrow">

    <p class="eyebrow">
        ADMIN
    </p>


    <h1>
        Dashboard login
    </h1>


    {% if error %}

    <div class="alert error">

        {{ error }}

    </div>

    {% endif %}


    <form
        action="/admin/login"
        method="post"
    >

        <label>

            Password

            <input
                type="password"
                name="password"
                required
                autocomplete="current-password"
            >

        </label>


        <button
            class="button"
            type="submit"
        >
            Sign in
        </button>

    </form>

</section>

{% endblock %}
